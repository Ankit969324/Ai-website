<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Classroom Hub</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.0/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f6f7fb;--panel:#fff;--ink:#172033;--muted:#667085;--line:#e5e7eb;--brand:#4f46e5;--brand2:#7c3aed;--ok:#16a34a;--bad:#dc2626}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.side{width:270px;background:#111827;color:#fff;padding:22px 14px;position:fixed;inset:0 auto 0 0;overflow:auto}.logo{font-size:22px;font-weight:800;padding:8px 10px 22px}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#cbd5e1;padding:11px 12px;border-radius:10px;margin:3px 0}.nav button:hover,.nav button.active{background:#263247;color:#fff}.main{margin-left:270px;width:calc(100% - 270px);padding:28px;max-width:1500px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.top h1{margin:0;font-size:30px}.badge{padding:8px 12px;border:1px solid var(--line);background:#fff;border-radius:999px;color:var(--muted);font-size:13px}.view{display:none}.view.active{display:block}.hero{background:linear-gradient(135deg,#312e81,#7c3aed);color:#fff;padding:28px;border-radius:20px;margin-bottom:20px}.hero h2{margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 3px 15px #1118270a}.card h3{margin-top:0}.fields{display:grid;gap:12px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}label{font-size:13px;font-weight:700;color:#344054}input,textarea,select{width:100%;border:1px solid #d0d5dd;border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink)}textarea{min-height:130px;resize:vertical}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}button.primary{background:var(--brand);color:#fff;padding:10px 14px;border-radius:10px;font-weight:700}button.secondary{background:#eef2ff;color:#3730a3;padding:10px 14px;border-radius:10px}button.ghost{background:#f2f4f7;color:#344054;padding:10px 14px;border-radius:10px}.output{margin-top:16px;border:1px solid var(--line);border-radius:12px;padding:16px;background:#fafafa;min-height:80px}.muted{color:var(--muted)}.slide{min-height:260px;padding:30px;border-radius:16px;background:#111827;color:#fff}.slide h2{font-size:30px}.mind{display:flex;gap:10px;flex-wrap:wrap}.node{padding:12px 16px;background:#eef2ff;border:1px solid #c7d2fe;border-radius:12px}.tablewrap{overflow:auto}.data{border-collapse:collapse;width:100%}.data th,.data td{border-bottom:1px solid var(--line);padding:10px;text-align:left}.quiz-q{padding:14px;border:1px solid var(--line);border-radius:12px;margin:10px 0}.option{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);padding:10px;border-radius:9px;margin:7px 0}.correct{background:#dcfce7!important;border-color:#86efac!important}.wrong{background:#fee2e2!important;border-color:#fca5a5!important}.chat{height:430px;overflow:auto;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px}.bubble{max-width:80%;padding:10px 13px;border-radius:14px;margin:8px 0;white-space:pre-wrap}.user{background:#e0e7ff;margin-left:auto}.ai{background:#fff;border:1px solid var(--line)}.flash{perspective:1000px;max-width:430px;margin:15px auto}.flash-inner{position:relative;min-height:220px;transform-style:preserve-3d;transition:.5s}.flash.flip .flash-inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--line);border-radius:18px;background:#fff;padding:28px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:22px}.back{transform:rotateY(180deg);background:#f5f3ff}.schedule{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{border:1px solid var(--line);border-radius:10px;padding:10px;min-height:130px;background:#fff}.day b{display:block;margin-bottom:8px}.item{font-size:12px;background:#eef2ff;border-radius:7px;padding:7px;margin:5px 0}.status{font-size:13px;margin-top:8px}.success{color:var(--ok)}.danger{color:var(--bad)}.settings{position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;border-radius:14px;padding:10px 14px;box-shadow:0 10px 25px #0002}.mobile{display:none}@media(max-width:900px){.side{transform:translateX(-100%);z-index:5}.side.open{transform:none}.main{margin:0;width:100%;padding:18px}.mobile{display:block}.grid,.two,.three{grid-template-columns:1fr}.top h1{font-size:23px}}
</style></head>
<body>
<div class="app"><aside class="side" id="side"><div class="logo">✨ AI Classroom Hub</div><nav class="nav" id="nav"></nav></aside>
<main class="main"><div class="top"><div><button class="mobile ghost" onclick="side.classList.toggle('open')">☰</button><h1 id="title">Dashboard</h1></div><div class="badge">10 integrated classroom tools</div></div><div id="views"></div></main></div>
<button class="settings" onclick="openSettings()">⚙ AI Settings</button>
<div id="settingsModal" style="display:none;position:fixed;inset:0;background:#0008;z-index:10;padding:30px"><div class="card" style="max-width:650px;margin:5vh auto"><h2>AI Connection</h2><p class="muted">For production, call your own server endpoint so API keys are never exposed in the browser.</p><div class="fields"><label>AI endpoint<input id="apiEndpoint" placeholder="https://your-server.example/api/ai"></label><label>Optional demo mode<select id="demoMode"><option value="on">On — works without an API</option><option value="off">Off — use endpoint</option></select></label></div><div class="actions"><button class="primary" onclick="saveSettings()">Save</button><button class="ghost" onclick="closeSettings()">Close</button></div></div></div>
<script>
const modules=[['home','🏠','Dashboard'],['resume','📄','Resume Builder'],['notes','📝','Notes Generator'],['ppt','📊','PPT Generator'],['mind','🧠','Mind Map'],['sheets','📋','Google Sheets'],['quiz','❓','Quiz / MCQ'],['chat','💬','Subject Tutor'],['flash','🃏','Flashcards'],['planner','📅','Study Planner'],['ocr','📷','OCR Summarizer']];
const nav=document.getElementById('nav'),views=document.getElementById('views');
modules.forEach(([id,ic,name])=>{let b=document.createElement('button');b.innerHTML=ic+' &nbsp;'+name;b.onclick=()=>show(id);nav.appendChild(b);let v=document.createElement('section');v.id='view-'+id;v.className='view';views.appendChild(v)});
function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById('view-'+id).classList.add('active');document.querySelectorAll('.nav button').forEach((x,i)=>x.classList.toggle('active',modules[i][0]===id));document.getElementById('title').textContent=modules.find(x=>x[0]===id)[2];side.classList.remove('open')}
function card(title,body){return `<div class="card"><h3>${title}</h3>${body}</div>`}
function setup(){
view('home',`<div class="hero"><h2>One website for all 10 AI classroom tasks</h2><p>Generate learning materials, interact with AI, visualize results, and connect Google Sheets from one dashboard.</p></div><div class="grid">${modules.slice(1).map(x=>card(x[1]+' '+x[2],`<p class="muted">Open this module from the left menu.</p><button class="primary" onclick="show('${x[0]}')">Open tool</button>`)).join('')}</div>`);
view('resume',card('AI Resume Builder',`<div class="fields two"><label>Name<input id="rname"></label><label>Contact<input id="rcontact"></label><label>Education<textarea id="reducation"></textarea></label><label>Skills<textarea id="rskills"></textarea></label><label>Experience<textarea id="rexperience"></textarea></label><label>Objective<textarea id="robjective"></textarea></label></div><div class="actions"><button class="primary" onclick="resume()">Generate Resume</button><button class="secondary" onclick="pdfFrom('resumeOut')">Download PDF</button></div><div id="resumeOut" class="output"></div>`));
view('notes',card('AI Notes Generator',`<textarea id="notesIn" placeholder="Paste a topic or textbook paragraph..."></textarea><div class="actions"><button class="primary" onclick="notes()">Generate Notes</button><button class="secondary" onclick="copyEl('notesOut')">Copy</button><button class="ghost" onclick="downloadText('notes.txt',document.getElementById('notesOut').innerText)">Download .txt</button></div><div id="notesOut" class="output"></div>`));
view('ppt',card('AI Presentation Generator',`<input id="pptTopic" placeholder="Presentation topic"><div class="actions"><button class="primary" onclick="ppt()">Generate 6 Slides</button><button class="ghost" onclick="prevSlide()">Previous</button><button class="ghost" onclick="nextSlide()">Next</button></div><div id="pptOut" class="output"></div>`));
view('mind',card('AI Mind Map Generator',`<textarea id="mindIn" placeholder="Paste syllabus/topic list..."></textarea><div class="actions"><button class="primary" onclick="mind()">Generate Map</button></div><div id="mindOut" class="output"></div>`));
view('sheets',card('Google Sheets Backend',`<div class="fields"><label>Apps Script Web App URL<input id="sheetUrl" placeholder="https://script.google.com/macros/s/.../exec"></label><label>New row (comma-separated)<input id="sheetRow" placeholder="Asha,Physics,87"></label></div><div class="actions"><button class="primary" onclick="loadSheet()">Read Sheet</button><button class="secondary" onclick="postSheet()">Add Row</button></div><div id="sheetStatus" class="status muted"></div><div id="sheetOut" class="output"></div>`));
view('quiz',card('AI Quiz / MCQ Generator',`<textarea id="quizIn" placeholder="Enter a topic or paste notes..."></textarea><div class="actions"><button class="primary" onclick="quiz()">Generate Quiz</button></div><div id="quizOut" class="output"></div>`));
view('chat',card('AI Subject Doubt-Solving Tutor',`<div class="fields two"><label>Subject<input id="chatSubject" placeholder="Mathematics"></label><label>Question<input id="chatInput" placeholder="Ask a question..."></label></div><div class="actions"><button class="primary" onclick="chatSend()">Send</button><button class="ghost" onclick="chatClear()">Clear Chat</button></div><div id="chatOut" class="chat"></div>`));
view('flash',card('AI Flashcards',`<textarea id="flashIn" placeholder="Paste chapter/topic..."></textarea><div class="actions"><button class="primary" onclick="flashcards()">Generate Cards</button><button class="ghost" onclick="shuffleFlash()">Shuffle</button></div><div id="flashOut"></div>`));
view('planner',card('AI Study Planner / Timetable',`<div class="fields three"><label>Subjects<input id="pSubjects" placeholder="Math, Physics, English"></label><label>Hours/day<input id="pHours" type="number" value="3"></label><label>Exam dates<input id="pDates" placeholder="Math: 2026-10-05"></label></div><div class="actions"><button class="primary" onclick="planner()">Generate Plan</button></div><div id="plannerOut" class="output"></div>`));
view('ocr',card('OCR + AI Notes Summarizer',`<input id="ocrFile" type="file" accept="image/*"><div class="actions"><button class="primary" onclick="runOCR()">Extract Text</button></div><label>Extracted / corrected text<textarea id="ocrText"></textarea></label><div class="actions"><button class="secondary" onclick="summarizeOCR()">Summarize with AI</button></div><div id="ocrOut" class="output"></div>`));
show('home');}
function view(id,html){document.getElementById('view-'+id).innerHTML=html}
let settings=JSON.parse(localStorage.getItem('aiClassroomSettings')||'{}');let pptSlides=[],pptIndex=0,flashDeck=[],flashIndex=0,chatHistory=[];
async function ai(prompt,fallback){if(settings.demoMode!=='off'||!settings.apiEndpoint)return fallback;try{let r=await fetch(settings.apiEndpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});if(!r.ok)throw Error('AI request failed');let j=await r.json();return j.output||j.text||JSON.stringify(j)}catch(e){return fallback+'\n\n[AI endpoint error: '+e.message+']'}}
function fallbackNotes(t){return `# Study Notes\n\n## Key idea\n${t.slice(0,400)}\n\n## Remember\n- Identify the main concept\n- Break it into smaller points\n- Review examples and definitions`}
async function resume(){let f=['rname','rcontact','reducation','rskills','rexperience','robjective'].map(id=>document.getElementById(id).value);let s=`# ${f[0]}\n\n**Contact:** ${f[1]}\n\n## Objective\n${f[5]}\n\n## Education\n${f[2]}\n\n## Skills\n${f[3]}\n\n## Experience\n${f[4]}`;document.getElementById('resumeOut').innerHTML=marked.parse(await ai('Create a polished professional resume from: '+f.join('\n'),s))}
async function notes(){let t=notesIn.value;notesOut.innerHTML=marked.parse(await ai('Convert into concise headings and bullet-point study notes: '+t,fallbackNotes(t)))}
async function ppt(){let t=pptTopic.value||'AI in Education';pptSlides=Array.from({length:6},(_,i)=>({title:i?`${t}: Key Point ${i}`:t,bullets:i?[`Important concept ${i}`,`Example or application ${i}`,`Key takeaway ${i}`]:['Overview','Purpose','Learning goals']}));pptIndex=0;renderSlide()}
function renderSlide(){pptOut.innerHTML=pptSlides.length?`<div class="slide"><h2>${pptSlides[pptIndex].title}</h2><ul>${pptSlides[pptIndex].bullets.map(x=>'<li>'+x+'</li>').join('')}</ul><p>Slide ${pptIndex+1} / ${pptSlides.length}</p></div>`:''}function nextSlide(){if(pptSlides.length){pptIndex=(pptIndex+1)%pptSlides.length;renderSlide()}}function prevSlide(){if(pptSlides.length){pptIndex=(pptIndex-1+pptSlides.length)%pptSlides.length;renderSlide()}}
async function mind(){let t=mindIn.value;let words=t.split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean);if(!words.length)words=['Syllabus'];mindOut.innerHTML='<div class="mind">'+words.map((x,i)=>`<div class="node"><b>${x}</b><div class="muted">Key point ${i+1}</div></div>`).join('')+'</div>'}
async function loadSheet(){let u=sheetUrl.value;try{let r=await fetch(u);let d=await r.json();sheetOut.innerHTML=table(d);sheetStatus.textContent='Loaded from Google Apps Script.'}catch(e){sheetStatus.textContent='Could not load endpoint: '+e.message}}
async function postSheet(){try{await fetch(sheetUrl.value,{method:'POST',body:JSON.stringify({row:sheetRow.value.split(',')})});sheetStatus.textContent='Row submitted.';loadSheet()}catch(e){sheetStatus.textContent='Could not submit row: '+e.message}}
function table(d){if(!Array.isArray(d))return '<pre>'+esc(JSON.stringify(d,null,2))+'</pre>';return '<div class="tablewrap"><table class="data"><tbody>'+d.map((r,i)=>'<tr>'+((Array.isArray(r)?r:Object.values(r)).map(c=>(i===0?'<th>':'<td>')+esc(c)+(i===0?'</th>':'</td>')).join(''))+'</tr>').join('')+'</tbody></table></div>'}
async function quiz(){let t=quizIn.value;let qs=[...Array(5)].map((_,i)=>({q:`Which statement best describes ${t||'this topic'}?`,o:['Definition or core idea','Unrelated idea','Opposite claim','Random detail'],a:0}));quizOut.innerHTML=qs.map((q,i)=>`<div class="quiz-q"><b>${i+1}. ${q.q}</b>${q.o.map((o,j)=>`<button class="option" onclick="answer(this,${j===q.a})">${o}</button>`).join('')}</div>`).join('')}
let score=0;function answer(b,ok){if(b.parentElement.dataset.done)return;b.parentElement.dataset.done=1;b.classList.add(ok?'correct':'wrong');if(ok)score++;let n=document.querySelectorAll('.quiz-q[data-done]').length;if(n===document.querySelectorAll('.quiz-q').length)quizOut.insertAdjacentHTML('beforeend',`<h3>Score: ${score}/${n}</h3>`)}
async function chatSend(){let q=chatInput.value.trim();if(!q)return;chatHistory.push({role:'user',content:q});chatOut.insertAdjacentHTML('beforeend',`<div class="bubble user">${esc(q)}</div>`);chatInput.value='';let ans=await ai(`You are a helpful ${chatSubject.value||'subject'} tutor. Explain simply with examples. Question: ${q}`,`Here is a simple explanation of your question: ${q}\n\nStart with the definition, work through a small example, then check your understanding with a practice question.`);chatHistory.push({role:'assistant',content:ans});chatOut.insertAdjacentHTML('beforeend',`<div class="bubble ai">${esc(ans)}</div>`);chatOut.scrollTop=chatOut.scrollHeight}
function chatClear(){chatHistory=[];chatOut.innerHTML=''}
async function flashcards(){let t=flashIn.value;flashDeck=[...Array(8)].map((_,i)=>({q:`What is an important point about ${t||'this chapter'}?`,a:`Review point ${i+1}: identify the definition, example, and application.`}));flashIndex=0;renderFlash()}
function renderFlash(){let c=flashDeck[flashIndex];flashOut.innerHTML=c?`<div class="flash" onclick="this.classList.toggle('flip')"><div class="flash-inner"><div class="face">${esc(c.q)}</div><div class="face back">${esc(c.a)}</div></div></div><p style="text-align:center">Card ${flashIndex+1}/${flashDeck.length} · tap to flip</p><div class="actions" style="justify-content:center"><button class="ghost" onclick="event.stopPropagation();flashIndex=(flashIndex-1+flashDeck.length)%flashDeck.length;renderFlash()">Previous</button><button class="ghost" onclick="event.stopPropagation();flashIndex=(flashIndex+1)%flashDeck.length;renderFlash()">Next</button></div>`:''}
function shuffleFlash(){flashDeck.sort(()=>Math.random()-.5);renderFlash()}
async function planner(){let subjects=pSubjects.value.split(',').map(x=>x.trim()).filter(Boolean);let days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];plannerOut.innerHTML='<div class="schedule">'+days.map((d,i)=>`<div class="day"><b>${d}</b>${subjects.slice(0,Math.max(1,Math.min(3,Number(pHours.value)||3))).map((s,j)=>`<div class="item">${j+1}:00 — ${s}</div>`).join('')}</div>`).join('')+'</div>'}
async function runOCR(){let f=ocrFile.files[0];if(!f)return;ocrText.value='Running OCR...';let r=await Tesseract.recognize(f,'eng');ocrText.value=r.data.text}
async function summarizeOCR(){let t=ocrText.value;ocrOut.innerHTML=marked.parse(await ai('Summarize this OCR text into key study points: '+t,fallbackNotes(t)))}
function pdfFrom(id){let text=document.getElementById(id).innerText;let {jsPDF}=window.jspdf;let p=new jsPDF();p.text(p.splitTextToSize(text,180),15,15);p.save('ai-classroom-output.pdf')}
function copyEl(id){navigator.clipboard.writeText(document.getElementById(id).innerText)}function downloadText(name,text){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download=name;a.click()}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function openSettings(){apiEndpoint.value=settings.apiEndpoint||'';demoMode.value=settings.demoMode||'on';settingsModal.style.display='block'}function closeSettings(){settingsModal.style.display='none'}function saveSettings(){settings={apiEndpoint:apiEndpoint.value.trim(),demoMode:demoMode.value};localStorage.setItem('aiClassroomSettings',JSON.stringify(settings));closeSettings()}
setup();
</script></body></html>
